<header class="sheet-header">
	<img class="profile-img" src="{{item.img}}" data-action="editImage" data-edit="img" title="{{item.name}}" />
	<div class="header-fields">
		<h1 class="charname"><input name="name" type="text" value="{{item.name}}" placeholder="{{localize 'ETERNIA.Placeholder.Name'}}" /></h1>
		<div class="grid grid-3col">
			<div class="resource grid-span-3">
				<div class="flexrow">
					<label class="resource-label">{{localize 'ETERNIA.Label.Tags'}}</label>
				</div>
				{{> "systems/eternia/templates/parts/tag-input.html"}}
			</div>
		</div>
	</div>
</header>
