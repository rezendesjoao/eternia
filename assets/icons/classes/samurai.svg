<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Eternia: the Samurai's crest, a katana leaving its scabbard (own art). -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfe5ec"/>
      <stop offset="1" stop-color="#9aa4b1"/>
    </linearGradient>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d1f1b"/>
      <stop offset="1" stop-color="#3a0b09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.5" stop-color="#e2bd5c"/>
      <stop offset="1" stop-color="#8a6a25"/>
    </linearGradient>
  </defs>
  <g stroke="#160c06" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- scabbard (saya) -->
    <path d="M70 63 L26 107 Q20 113 15 113 Q15 108 21 102 L65 58 Z" fill="url(#lacquer)"/>
    <path d="M27 101 L19 109 Q16 112 15 113 Q15 110 17 107 L23 99 Z" fill="url(#gold)"/>
    <!-- cord (sageo) -->
    <path d="M58 72 Q46 70 44 80 Q43 90 54 88" fill="none" stroke="#f2db94" stroke-width="2.6"/>
    <!-- blade leaving the mouth of the scabbard -->
    <path d="M65 58 L84 39 L89 44 L70 63 Z" fill="url(#steel)"/>
    <path d="M68 59 L85 42" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
    <!-- collar (habaki) and guard (tsuba) -->
    <path d="M83 38 L88 33 L94 39 L89 44 Z" fill="url(#gold)"/>
    <ellipse cx="91.5" cy="36.5" rx="5" ry="13" transform="rotate(45 91.5 36.5)" fill="#2b2116"/>
    <ellipse cx="91.5" cy="36.5" rx="5" ry="13" transform="rotate(45 91.5 36.5)" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <!-- handle (tsuka) with its diamond wrap -->
    <path d="M95 29 L111 13 Q116 9 119 12 Q122 15 118 20 L102 36 Z" fill="#efe4c9"/>
    <path d="M99 30 L104 35 M103 26 L108 31 M107 22 L112 27 M111 18 L116 23 M99 35 L104 25 M103 31 L108 21 M107 27 L112 17 M111 23 L115 15" fill="none" stroke="#7d1f1b" stroke-width="2"/>
    <path d="M114 10 Q118 8 120 11 Q122 14 119 17 Z" fill="url(#gold)"/>
  </g>
</svg>
